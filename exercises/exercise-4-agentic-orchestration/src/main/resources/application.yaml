server:
  port: 8082

camunda:
  client:
    mode: self-managed
    prefer-rest-over-grpc: false
    rest-address: http://localhost:9600
    grpc-address: http://localhost:26500
    enabled: true
    auth:
      method: none

ollama:
  base-url: http://localhost:11434
  model: smollm2:360m
  timeout-seconds: 120
