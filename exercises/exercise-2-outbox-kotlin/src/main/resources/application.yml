camunda:
  client:
    mode: self-managed
    prefer-rest-over-grpc: false
    rest-address: http://localhost:9600
    grpc-address: http://localhost:26500
    enabled: true
    auth:
      method: none

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/c8-dev-training
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  task:
    scheduling:
      enabled: true
