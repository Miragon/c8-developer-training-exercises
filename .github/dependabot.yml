version: 2

# Backend stack: Maven code deps and the docker-compose images the exercises
# run on move together in a single monthly PR (Camunda engine + client,
# Postgres image + JDBC driver stay in lockstep).
multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:

  # Backend stack member: Maven (multi-module, root aggregates the exercises)
  - package-ecosystem: "maven"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # Backend stack member: Docker Compose infrastructure
  - package-ecosystem: "docker-compose"
    directory: "/stack"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # GitHub Actions: standalone, fully grouped, with cooldown + security group
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
